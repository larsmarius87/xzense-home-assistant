name: Build and publish Xzense 0.5.27
on:
  push:
    branches:
      - xzense-0.5.27-alpha
    paths:
      - .github/workflows/build-xzense-0527.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build 0.5.27 source archive
        run: |
          sed -i "/before\\['entity'\\]\\[kind\\]\\['name'\\]=/d" tools/build_xzense_0527.py
          python tools/build_xzense_0527.py
          python tools/patch_0527_tests.py
      - name: Test 0.5.27 release
        run: |
          python -m pip install -q pytest
          cd _build_0527
          python -m pytest -q
      - name: Check archive integrity
        run: unzip -t xzense-alpha-0.5.27-source.zip
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xzense-alpha-0.5.27-source
          path: xzense-alpha-0.5.27-source.zip
          retention-days: 14
      - name: Commit built ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xzense-alpha-0.5.27-source.zip
          git diff --cached --quiet || (git commit -m "release: Xzense Alpha 0.5.27 test ZIP" && git push)
