name: Prepare HACS test 0.5.28
on:
  push:
    branches:
      - HACS
    paths:
      - .github/workflows/prepare-hacs-0528.yml
      - tools/build_hacs_0528.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build HACS integration directory from corrected 0.5.27
        run: python tools/build_hacs_0528.py
      - name: Validate Python syntax and HACS layout
        run: |
          python -m compileall -q custom_components/xzense_full_preview
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('custom_components')
          dirs=[p for p in root.iterdir() if p.is_dir()]
          assert len(dirs)==1, dirs
          app=dirs[0]
          manifest=json.loads((app/'manifest.json').read_text())
          assert manifest['domain']==app.name, manifest
          assert manifest['version']=='0.5.28'
          assert (app/'__init__.py').is_file()
          assert (app/'config_flow.py').is_file()
          assert (app/'translations'/'nb.json').is_file()
          assert json.loads(Path('hacs.json').read_text())['name']
          print('HACS layout OK, domain:',app.name)
          PY
      - name: Publish HACS directory to the HACS branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/xzense_full_preview hacs.json
          if ! git diff --cached --quiet; then
            git commit -m "test: publish Xzense 0.5.28 HACS layout"
            git push origin HEAD:HACS
          fi
