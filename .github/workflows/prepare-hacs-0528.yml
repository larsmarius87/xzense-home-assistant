name: Build and release Xzense 0.5.28.7
on:
  push:
    branches:
      - HACS
    paths:
      - .github/workflows/prepare-hacs-0528.yml
      - tools/build_hacs_0528.py
      - tools/xzense_card_05281.js
      - tools/test_card_05281.cjs
      - tools/test_bluetooth_discovery.py
      - tools/test_boost_fan_speed_guard.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build HACS integration directory from corrected 0.5.27
        run: |
          rm -rf custom_components/xzense hacs.json
          python tools/build_hacs_0528.py
      - name: Validate Python syntax and HACS layout
        run: |
          python -m compileall -q custom_components/xzense
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('custom_components')
          dirs=[p for p in root.iterdir() if p.is_dir()]
          assert len(dirs)==1, dirs
          app=dirs[0]
          manifest=json.loads((app/'manifest.json').read_text())
          assert manifest['domain']==app.name=='xzense', manifest
          assert manifest['version']=='0.5.28.7'
          assert (app/'__init__.py').is_file()
          assert (app/'config_flow.py').is_file()
          assert (app/'translations'/'nb.json').is_file()
          assert json.loads(Path('hacs.json').read_text())['name']
          numbers=(app/'number.py').read_text()
          for class_name in ('XzenseUpdateInterval','XzenseActiveUpdateInterval'):
              section=numbers.split('class '+class_name+'(',1)[1].split('\\nclass ',1)[0]
              assert '_attr_mode = NumberMode.BOX' in section, class_name
              assert '_attr_mode = NumberMode.SLIDER' not in section, class_name
          const=(app/'const.py').read_text()
          assert 'VERSION = "0.5.28.7"' in const
          sensor=(app/'sensor.py').read_text()
          assert "lambda s: min(100, s.globals[0x04]) if 0x04 in s.globals else None" in sensor
          # Regression check of values; raw GLOBAL dictionary must remain intact.
          for raw,expected in ((None,None),(0,0),(29,29),(100,100),(101,100),(115,100)):
              globals_ = {} if raw is None else {0x04:raw}
              observed = min(100, globals_[0x04]) if 0x04 in globals_ else None
              assert observed == expected
              assert raw is None or globals_[0x04] == raw
          assert '/api/xzense/xzense-card.js' in (app/'__init__.py').read_text()
          assert 'xzense.timing_' in (app/'client.py').read_text()
          assert 'xzense.cache_' in (app/'client.py').read_text()
          for file in app.rglob('*.py'):
              data=file.read_text()
              assert 'full_preview' not in data, file
          assert 'full_preview' not in (app/'__init__.py').read_text()
          assert 'Xzense-kort 0.5.28.7' in (app/'www'/'xzense-card.js').read_text()
          assert 'Xzense Dashboard 0.5.28.7' in (app/'www'/'xzense-card.js').read_text()
          assert Path('docs/releases/0.5.28.7.md').is_file()
          notes=Path('docs/releases/0.5.28.7.md').read_text()
          assert '## Norsk' in notes and '## English' in notes
          assert '0.5.28.7' in notes
          discovery=json.loads((app/'manifest.json').read_text())['bluetooth']
          assert discovery==[{'local_name':'Xzense*','connectable':True}]
          assert 'SERVICE_UUID,' not in (app/'config_flow.py').read_text()
          client=(app/'client.py').read_text()
          assert 'async def _async_check_fan_speed_write_allowed(self)' in client
          assert 'await self._async_check_fan_speed_write_allowed()' in client
          assert 'if self.state.status.device_state == 3:' in client
          assert 'feature_key == "user_fan_speed"' in client
          card=(app/'www'/'xzense-card.js').read_text()
          assert "this._numeric('bluetooth_update_interval',true)" in card
          assert "this._numeric('bluetooth_active_update_interval',true)" in card
          print('HACS layout OK, domain:',app.name)
          PY
      - name: Validate Bluetooth discovery against unrelated DSPS advertisements
        run: python tools/test_bluetooth_discovery.py
      - name: Validate Boost fan-speed write interlock
        run: python tools/test_boost_fan_speed_guard.py
      - name: Validate dashboard JavaScript
        run: |
          node --check custom_components/xzense/www/xzense-card.js
          node --check tools/xzense_card_05281.js
          cmp custom_components/xzense/www/xzense-card.js tools/xzense_card_05281.js
          node tools/test_card_05281.cjs
          grep -F "this._field(key)?.domain==='button' || e.state!=='unknown'" custom_components/xzense/www/xzense-card.js
      - name: Publish HACS directory to the HACS branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find custom_components/xzense -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A custom_components/ hacs.json
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Xzense 0.5.28.7 HACS layout"
            git push origin HEAD:HACS
          fi
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="0.5.28.7"
          # The build commit (if any) is HEAD; attach the tag to tested files.
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping."
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
              echo "Tag $VERSION exists. Will publish release from that tag."
              gh release create "$VERSION" --repo "${{ github.repository }}" --title "Xzense $VERSION" --notes-file "docs/releases/$VERSION.md" --verify-tag --latest
            else
              gh release create "$VERSION" --repo "${{ github.repository }}" --target "$TARGET" --title "Xzense $VERSION" --notes-file "docs/releases/$VERSION.md" --latest
            fi
          fi
