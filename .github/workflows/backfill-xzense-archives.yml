name: Restore missing Xzense archives (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xzense-archive-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'brotli==1.1.0'
      - name: Rebuild and validate archives
        run: python tools/backfill_xzense_archives.py
      - name: Commit generated source releases
        run: |
          git add -- arkiv/versjoner/ arkiv/tillegg/
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'archive: restore missing Xzense release ZIPs'
          git push origin HEAD:main
