name: Export Xzense 0.5.26 ZIP for download
on:
  push:
    branches:
      - xzense-0.5.26-refueling-test
    paths:
      - .github/workflows/export-xzense-0526.yml
  workflow_dispatch:
jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check source archive
        run: unzip -t xzense-alpha-0.5.26-source.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xzense-alpha-0.5.26-source
          path: xzense-alpha-0.5.26-source.zip
          retention-days: 1
